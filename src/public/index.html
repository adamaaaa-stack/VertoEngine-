<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verto Engine - Visual Scripting Editor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="top-bar-left">
        <h1>Verto Engine</h1>
      </div>
      <div class="top-bar-center">
        <button id="btnNew" class="btn btn-primary">New</button>
        <button id="btnOpen" class="btn btn-primary">Open</button>
        <button id="btnSave" class="btn btn-primary">Save</button>
        <button id="btnRun" class="btn btn-success">Run</button>
        <button id="btnStop" class="btn btn-danger" disabled>Stop</button>
      </div>
      <div class="top-bar-right">
        <div id="errorMessage" class="error-message"></div>
      </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
      <!-- Left Panel - Node Library -->
      <div class="left-panel">
        <div class="panel-header">
          <h3>Nodes</h3>
        </div>
        <div class="search-box">
          <input type="text" id="nodeSearch" placeholder="Add node..." />
        </div>
        <div class="node-categories" id="nodeCategories">
          <!-- Categories will be populated dynamically -->
        </div>
      </div>

      <!-- Center Canvas -->
      <div class="canvas-container">
        <canvas id="graphCanvas"></canvas>
        <div class="canvas-info">
          <p>Drag nodes from the left panel, or right-click to add.</p>
          <p>Pan: Space + Drag | Zoom: Ctrl + Scroll | Connect: Drag pin to pin</p>
        </div>
      </div>

      <!-- Right Panel - Assets -->
      <div class="right-panel">
        <div class="panel-header">
          <h3>Assets</h3>
        </div>
        <button id="btnImportAsset" class="btn btn-small">Import Asset</button>
        <div class="asset-list" id="assetList">
          <!-- Assets will be listed here -->
        </div>
      </div>
    </div>

    <!-- Modal for node properties (optional) -->
    <div id="nodePropertiesModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Node Properties</h3>
          <button class="close-btn">&times;</button>
        </div>
        <div class="modal-body" id="modalBody">
          <!-- Properties form will be populated -->
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary">OK</button>
          <button class="btn btn-secondary">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="../index.js"></script>
    <script src="ui.js"></script>
  </body>
</html>
